<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mohamad Hashem Dankar — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
:root{
  --ink:#0E1417; --ink-2:#131C21; --ink-3:#1E2A31;
  --paper:#EDE9E1; --paper-2:#E3DED2; --line:#C9C1B0;
  --sig:#2C6A72; --sig-br:#4FB7C4; --warm:#A9722F;
  --tx:#1C2529; --tx-mut:#5D5747;
}
*{margin:0;padding:0;box-sizing:border-box}
@page{size:297mm 210mm;margin:0}
html,body{background:#fff}
body{font-family:"Spectral",Georgia,serif;color:var(--tx);-webkit-print-color-adjust:exact;print-color-adjust:exact}
img{display:block;width:100%;height:100%;object-fit:cover}

.pg{position:relative;width:297mm;height:210mm;overflow:hidden;background:var(--paper);
    page-break-after:always;break-after:page}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg.dark{background:var(--ink);color:#EDF2F3}

.mono{font-family:"Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.arch{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}

/* ---------- running furniture ---------- */
.foot{position:absolute;left:14mm;right:14mm;bottom:7mm;display:flex;justify-content:space-between;
  align-items:center;font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tx-mut)}
.dark .foot{color:#7C8A91}
.foot .pn{color:var(--sig)}
.dark .foot .pn{color:var(--sig-br)}

/* ---------- page header band ---------- */
.hd{position:absolute;left:14mm;right:14mm;top:12mm;display:flex;align-items:baseline;gap:5mm}
.hd .cd{font-family:"Space Mono",monospace;font-size:7pt;letter-spacing:.16em;color:var(--sig);flex:none}
.hd h2{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;
  font-size:15pt;line-height:1;letter-spacing:-.01em;color:var(--tx);flex:none}
.dark .hd h2{color:#fff}
.hd .rule{flex:1;height:.35mm;background:var(--line)}
.dark .hd .rule{background:var(--ink-3)}
.hd .tag{font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.16em;color:var(--tx-mut);
  text-transform:uppercase;flex:none;text-align:right;max-width:78mm}

/* ---------- body region under the header ---------- */
.bd{position:absolute;left:14mm;right:14mm;top:22mm;bottom:15mm}

/* ---------- text column ---------- */
.col{width:66mm;float:left;padding-right:7mm}
.col p{font-size:8.4pt;line-height:1.5;color:var(--tx);margin-bottom:3.4mm}
.dark .col p{color:#D6DDDF}
.col p b{font-weight:500}
.col .tags{display:flex;flex-wrap:wrap;gap:1.6mm;margin-bottom:3.6mm}
.col .tags span{font-family:"Space Mono",monospace;font-size:5.4pt;letter-spacing:.12em;text-transform:uppercase;
  border:.3mm solid var(--line);padding:1mm 2mm;color:var(--tx-mut)}
.dark .col .tags span{border-color:var(--ink-3);color:#94A2A8}
.col dl{margin-top:4mm;border-top:.3mm solid var(--line)}
.dark .col dl{border-color:var(--ink-3)}
.col dl div{display:grid;grid-template-columns:20mm 1fr;gap:2mm;padding:1.5mm 0;border-bottom:.3mm solid var(--line)}
.dark .col dl div{border-color:var(--ink-3)}
.col dt{font-family:"Space Mono",monospace;font-size:5.4pt;letter-spacing:.13em;text-transform:uppercase;color:var(--sig)}
.col dd{font-size:7.4pt;line-height:1.35;color:var(--tx)}
.dark .col dd{color:#D6DDDF}

/* ---------- figures ---------- */
figure{position:relative;overflow:hidden;background:var(--paper-2)}
.dark figure{background:var(--ink-2)}
figure figcaption{position:absolute;left:0;bottom:0;font-family:"Space Mono",monospace;font-size:5pt;
  letter-spacing:.1em;text-transform:uppercase;color:#F0F4F5;background:rgba(14,20,23,.82);padding:1.1mm 2.2mm;
  max-width:100%}
figure.contain{background:#fff}
figure.contain img{object-fit:contain}
figure.sheetbg{background:#E9E8E4}
figure.sheetbg img{object-fit:contain}
figure.contain2{background:var(--paper-2)}
figure.contain2 img{object-fit:contain}
figure.onink{background:#000}
figure.onink img{object-fit:contain}

/* any figure used as a fill layer must take its box, not its natural height */
.bgimg>figure,.stack .hero>figure,.plate .bgimg>figure{width:100%;height:100%}

/* image stack to the right of a text column */
.stack{margin-left:66mm;height:100%;display:flex;flex-direction:column;gap:3mm}
.stack .hero{flex:1;min-height:0;position:relative;overflow:hidden}
.stack .hero>figure{width:100%;height:100%}
.stack .row{height:36mm;display:grid;gap:3mm}
.stack .row>figure{min-width:0;min-height:0}
.stack .row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack .row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack .row.c4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* full-width grids — minmax(0,…) everywhere, or an image's intrinsic
   height inflates the track and the page overflows its trim */
.grid{height:100%;display:grid;gap:3mm}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid.r1{grid-template-rows:minmax(0,1fr)}
.grid.r2{grid-template-rows:repeat(2,minmax(0,1fr))}
.grid.r3{grid-template-rows:repeat(3,minmax(0,1fr))}
.grid figure{width:100%;height:100%;min-width:0;min-height:0}

/* ---------- cover ---------- */
.cover .bgimg{position:absolute;inset:0}
.cover .scrim{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(14,20,23,.86) 0%,rgba(14,20,23,.26) 24%,rgba(14,20,23,.34) 44%,rgba(14,20,23,.84) 76%,rgba(14,20,23,.97) 100%)}
.cover .in>.tt{margin-top:auto;margin-bottom:7mm}
.cover .in{position:absolute;left:16mm;right:16mm;top:14mm;bottom:14mm;display:flex;flex-direction:column;
  justify-content:space-between;color:#fff}
.cover .kick{font-family:"Space Mono",monospace;font-size:6.4pt;letter-spacing:.3em;text-transform:uppercase;
  color:var(--sig-br);display:flex;align-items:center;gap:3mm}
.cover .kick i{width:2.6mm;height:2.6mm;border:.3mm solid var(--sig-br);transform:rotate(45deg);display:block}
.cover h1{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:900;text-transform:uppercase;
  font-size:44pt;line-height:.9;letter-spacing:-.02em;text-shadow:0 1.5mm 9mm rgba(6,10,12,.72)}
.cover h1 b{color:var(--sig-br);font-weight:900}
.cover .role{font-size:12pt;margin-top:5mm;color:#DCE4E6;font-weight:300;text-shadow:0 1mm 6mm rgba(6,10,12,.8)}
.cover .role em{font-style:italic;color:var(--sig-br)}
.cover .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;
  border-top:.3mm solid rgba(255,255,255,.28);padding-top:4mm;
  font-family:"Space Mono",monospace;font-size:6pt;letter-spacing:.16em;text-transform:uppercase;color:#C3CDD1}
.cover .meta b{color:#fff;font-weight:400;display:block;margin-bottom:1mm;letter-spacing:.16em}

/* ---------- chapter divider ---------- */
.div .bgimg{position:absolute;inset:0}
.div .scrim{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(14,20,23,.96) 0%,rgba(14,20,23,.86) 40%,rgba(14,20,23,.20) 100%),
  linear-gradient(0deg,rgba(14,20,23,.90) 0%,rgba(14,20,23,.45) 12%,rgba(14,20,23,0) 26%)}
.div .in{position:absolute;left:16mm;top:16mm;bottom:16mm;width:150mm;display:flex;flex-direction:column;
  justify-content:center;color:#fff}
.div .cd{font-family:"Space Mono",monospace;font-size:6.4pt;letter-spacing:.3em;text-transform:uppercase;
  color:var(--sig-br);margin-bottom:5mm;display:flex;align-items:center;gap:3mm}
.div .cd i{width:2.4mm;height:2.4mm;border:.3mm solid var(--sig-br);transform:rotate(45deg);display:block}
.div h2{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:900;text-transform:uppercase;
  font-size:30pt;line-height:.94;letter-spacing:-.015em}
.div p{margin-top:6mm;font-size:10pt;line-height:1.5;color:#D8E0E2;max-width:118mm;font-weight:300}
.div p b{color:#fff;font-weight:500}
.div .strip{position:absolute;left:16mm;bottom:11mm;right:16mm;display:flex;gap:9mm;align-items:baseline;
  border-top:.3mm solid rgba(255,255,255,.25);padding-top:3.5mm;
  font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.16em;text-transform:uppercase;color:#9FADB3}
.div .strip b{color:var(--sig-br);font-weight:400}
.div .strip .pn{margin-left:auto;color:var(--sig-br)}

/* ---------- profile ---------- */
.prof .lead{font-size:14pt;line-height:1.42;font-weight:300;max-width:180mm;margin-bottom:7mm}
.prof .lead b{font-weight:500}
.prof .two{display:grid;grid-template-columns:1fr 88mm;gap:10mm}
.prof dl{border-top:.3mm solid var(--line)}
.prof dl div{display:grid;grid-template-columns:26mm 1fr;gap:3mm;padding:1.9mm 0;border-bottom:.3mm solid var(--line)}
.prof dt{font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.13em;text-transform:uppercase;color:var(--sig)}
.prof dd{font-size:8pt;line-height:1.4}
.prof .kk{font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sig);margin-bottom:3mm}
.prof .chips{display:flex;flex-wrap:wrap;gap:1.6mm}
.prof .chips span{font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.1em;
  border:.3mm solid var(--line);padding:1.2mm 2.2mm;color:var(--tx-mut)}
.prof .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:7mm;
  border:.3mm solid var(--line)}
.prof .stats div{padding:3.5mm 3mm;border-right:.3mm solid var(--line)}
.prof .stats div:last-child{border-right:0}
.prof .stats b{display:block;font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:800;font-size:17pt;
  line-height:1;color:var(--tx)}
.prof .stats span{font-family:"Space Mono",monospace;font-size:5.2pt;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx-mut);display:block;margin-top:1.6mm}
.prof .band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3mm;margin-top:7mm;height:62mm}
.prof .band figure{width:100%;height:100%}

/* ---------- contents ---------- */
.toc .cols{display:grid;grid-template-columns:1fr 1fr;gap:12mm;height:96mm}
.toc h3{display:flex;justify-content:space-between;align-items:baseline;gap:4mm;
  font-family:"Space Mono",monospace;font-size:5.8pt;letter-spacing:.22em;text-transform:uppercase;
  color:var(--sig);margin:4.5mm 0 1.5mm;padding-bottom:1.2mm;border-bottom:.3mm solid var(--line)}
.toc h3:first-child{margin-top:0}
.toc h3 .pp{font-size:6pt;letter-spacing:.1em}
.toc .idxband{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3mm;height:62mm;margin-top:7mm}
.toc .idxband figure{width:100%;height:100%;position:relative;overflow:hidden}
.toc .idxband .lbl{position:absolute;left:0;right:0;bottom:0;padding:3mm 3mm 2.6mm;
  background:linear-gradient(0deg,rgba(14,20,23,.96) 0%,rgba(14,20,23,.74) 46%,rgba(14,20,23,0) 100%);
  font-family:"Archivo",sans-serif;font-weight:700;font-size:8pt;text-transform:uppercase;
  letter-spacing:.01em;color:#fff;line-height:1.2}
.toc .idxband .lbl b{display:block;font-family:"Space Mono",monospace;font-size:5.4pt;font-weight:400;
  letter-spacing:.22em;color:var(--sig-br);margin-bottom:1.4mm}
.toc a,.toc .row{display:grid;grid-template-columns:11mm 1fr 8mm;gap:2mm;align-items:baseline;
  padding:1.25mm 0;font-size:8pt;color:var(--tx);text-decoration:none}
.toc .n{font-family:"Space Mono",monospace;font-size:5.8pt;color:var(--tx-mut);letter-spacing:.08em}
.toc .t{font-family:"Archivo",sans-serif;font-weight:600;font-size:8pt;letter-spacing:0}
.toc .p{font-family:"Space Mono",monospace;font-size:6pt;color:var(--sig);text-align:right}

/* ---------- full-bleed plate ---------- */
.plate .bgimg{position:absolute;inset:0}
.plate .cap{position:absolute;left:14mm;bottom:12mm;right:14mm;
  font-family:"Space Mono",monospace;font-size:5.8pt;letter-spacing:.16em;text-transform:uppercase;color:#EDF2F3;
  text-shadow:0 0 4mm rgba(0,0,0,.9)}
.plate .cap b{color:var(--sig-br);font-weight:400}

/* ---------- pipeline strip ---------- */
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:2.5mm;margin-bottom:4mm}
.pipe .st{border:.3mm solid var(--line);padding:3mm 2.6mm;background:var(--paper-2)}
.pipe .st .n{font-family:"Space Mono",monospace;font-size:5.4pt;color:var(--sig);letter-spacing:.12em}
.pipe .st h5{font-family:"Archivo",sans-serif;font-weight:700;font-size:7pt;text-transform:uppercase;margin:1.4mm 0 1mm}
.pipe .st p{font-family:"Space Mono",monospace;font-size:5pt;line-height:1.4;color:var(--tx-mut);letter-spacing:0}

/* ---------- back cover ---------- */
.back .in{position:absolute;left:16mm;right:16mm;top:16mm;bottom:16mm;display:flex;flex-direction:column;
  justify-content:space-between}
.back h2{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:900;text-transform:uppercase;
  font-size:34pt;line-height:.94;color:#fff}
.back h2 em{font-family:"Spectral",serif;font-style:italic;font-weight:300;text-transform:none;color:var(--sig-br)}
.back .links{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;
  border-top:.3mm solid rgba(255,255,255,.24);padding-top:5mm;margin-top:6mm}
.back .links .k{font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.16em;text-transform:uppercase;
  color:#8FA0A6;display:block;margin-bottom:1.8mm}
.back .links .v{font-family:"Archivo",sans-serif;font-weight:600;font-size:11pt;color:#fff;letter-spacing:-.005em}
.back .note{font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.16em;text-transform:uppercase;
  color:#7C8A91;line-height:1.9}
.back .note b{color:var(--sig-br);font-weight:400}
</style>
</head>
