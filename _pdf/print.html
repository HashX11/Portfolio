<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mohamad Hashem Dankar — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
:root{
  --ink:#0E1417; --ink-2:#131C21; --ink-3:#1E2A31; --ink-4:#2A3840;
  --paper:#EDE9E1; --paper-2:#E3DED2; --line:#C9C1B0;
  --sig:#2C6A72; --br:#4FB7C4; --warm:#A9722F;
  --tx:#1C2529; --mut:#5D5747;
  --M:13mm;
}
*{margin:0;padding:0;box-sizing:border-box}
@page{size:297mm 210mm;margin:0}
html,body{background:#fff}
body{font-family:"Spectral",Georgia,serif;color:var(--tx);
     -webkit-print-color-adjust:exact;print-color-adjust:exact}
img{display:block;width:100%;height:100%;object-fit:cover}

.pg{position:relative;width:297mm;height:210mm;overflow:hidden;background:var(--paper);
    page-break-after:always;break-after:page;color:var(--tx)}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg.dk{background:var(--ink);color:#EDF2F3}

/* ---------------------------------------------------------------- atoms */
.mono{font-family:"Space Mono",monospace;letter-spacing:.16em;text-transform:uppercase}
.disp{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:900;text-transform:uppercase;
      letter-spacing:-.02em;line-height:.92}

figure{position:relative;overflow:hidden;background:var(--paper-2);margin:0;min-width:0;min-height:0}
.dk figure{background:var(--ink-2)}
figcaption{position:absolute;left:0;bottom:0;z-index:2;max-width:100%;
  font-family:"Space Mono",monospace;font-size:4.9pt;letter-spacing:.11em;text-transform:uppercase;
  color:#EEF3F4;background:rgba(12,17,20,.80);padding:1.1mm 2.3mm;line-height:1.35}
figure.fit{background:#fff}          /* drawings & documents: white ground */
figure.fit img{object-fit:contain}
figure.fitd{background:var(--ink)}   /* renders that are already on black */
figure.fitd img{object-fit:contain}
figure.fitp{background:var(--paper-2)}
figure.fitp img{object-fit:contain}
figure.sheet{background:#E9E8E4}
figure.sheet img{object-fit:contain}

/* ---------------------------------------------------------------- page furniture */
.foot{position:absolute;left:var(--M);right:var(--M);bottom:6.5mm;z-index:6;
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:"Space Mono",monospace;font-size:5.2pt;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mut)}
.dk .foot{color:#66757C}
.foot .pn{color:var(--sig)}
.dk .foot .pn{color:var(--br)}
.foot.over{color:rgba(255,255,255,.62);text-shadow:0 0 3mm rgba(0,0,0,.9)}
.foot.over .pn{color:var(--br)}

.hd{position:absolute;left:var(--M);right:var(--M);top:11mm;z-index:5;
    display:flex;align-items:baseline;gap:5mm}
.hd .cd{font-family:"Space Mono",monospace;font-size:6.6pt;letter-spacing:.18em;color:var(--sig);flex:none}
.dk .hd .cd{color:var(--br)}
.hd h2{font-family:"Archivo",sans-serif;font-stretch:118%;font-weight:800;text-transform:uppercase;
  font-size:13.5pt;line-height:1;letter-spacing:-.005em;color:var(--tx);flex:none}
.dk .hd h2{color:#fff}
.hd .ln{flex:1;height:.3mm;background:var(--line)}
.dk .hd .ln{background:var(--ink-4)}
.hd .rt{font-family:"Space Mono",monospace;font-size:5.2pt;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mut);flex:none;text-align:right;max-width:96mm}
.dk .hd .rt{color:#84969C}

.lead{position:absolute;left:var(--M);right:var(--M);top:18.5mm;z-index:5;
  font-size:7.8pt;line-height:1.5;max-width:215mm;color:var(--mut)}
.dk .lead{color:#A9B8BE}
.lead b{color:var(--tx);font-weight:500}
.dk .lead b{color:#fff}

/* body box, optionally pushed down by a lead paragraph */
.bd{position:absolute;left:var(--M);right:var(--M);top:24mm;bottom:12.5mm;z-index:4}
.bd.low{top:31mm}

/* ---------------------------------------------------------------- grid */
.gr{display:grid;gap:3mm;align-content:start}
.gr.fill{height:100%}
.gr>figure{width:100%;height:100%}

/* ---------------------------------------------------------------- full bleed + panel */
.bleed{position:absolute;inset:0;z-index:0}
.bleed>figure{width:100%;height:100%}
.bleed img{width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;z-index:1;pointer-events:none}

.panel{position:absolute;z-index:3;left:0;bottom:0;width:118mm;
  background:rgba(12,17,20,.90);color:#EDF2F3;padding:11mm 12mm 11mm var(--M)}
.panel .cd{font-family:"Space Mono",monospace;font-size:6pt;letter-spacing:.24em;text-transform:uppercase;
  color:var(--br);display:flex;align-items:center;gap:2.6mm;margin-bottom:4mm}
.panel .cd i{width:2.2mm;height:2.2mm;border:.3mm solid var(--br);transform:rotate(45deg);display:block;flex:none}
.panel h2{font-family:"Archivo",sans-serif;font-stretch:118%;font-weight:800;text-transform:uppercase;
  font-size:17pt;line-height:.98;letter-spacing:-.01em;color:#fff;margin-bottom:4mm}
.panel .tags{display:flex;flex-wrap:wrap;gap:1.4mm;margin-bottom:4mm}
.panel .tags span{font-family:"Space Mono",monospace;font-size:4.8pt;letter-spacing:.12em;text-transform:uppercase;
  border:.25mm solid rgba(255,255,255,.30);padding:.9mm 1.9mm;color:#B9C6CB}
.panel p{font-size:7.6pt;line-height:1.52;color:#D3DBDE;margin-bottom:2.8mm}
.panel p b{color:#fff;font-weight:500}
.panel dl{margin-top:4mm;border-top:.25mm solid rgba(255,255,255,.22)}
.panel dl div{display:grid;grid-template-columns:19mm 1fr;gap:2mm;padding:1.3mm 0;
  border-bottom:.25mm solid rgba(255,255,255,.14)}
.panel dt{font-family:"Space Mono",monospace;font-size:4.7pt;letter-spacing:.14em;text-transform:uppercase;color:var(--br)}
.panel dd{font-size:6.8pt;line-height:1.3;color:#D3DBDE}

/* strip of small frames along the foot of a bleed page */
.filmstrip{position:absolute;z-index:3;right:var(--M);bottom:12mm;display:grid;gap:2.5mm}
.filmstrip figure{border:.3mm solid rgba(255,255,255,.22)}

/* ---------------------------------------------------------------- cover */
.ly-cover .in{position:absolute;inset:var(--M);z-index:3;display:flex;flex-direction:column;
  justify-content:space-between;color:#fff}
.ly-cover .kick{font-family:"Space Mono",monospace;font-size:6pt;letter-spacing:.32em;text-transform:uppercase;
  color:var(--br);display:flex;align-items:center;gap:3mm}
.ly-cover .kick i{width:2.6mm;height:2.6mm;border:.3mm solid var(--br);transform:rotate(45deg);display:block}
.ly-cover h1{font-size:46pt;text-shadow:0 1.5mm 10mm rgba(6,10,12,.75)}
.ly-cover h1 b{color:var(--br);font-weight:900}
.ly-cover .role{font-size:11.5pt;margin-top:5mm;color:#DCE4E6;font-weight:300;
  text-shadow:0 1mm 7mm rgba(6,10,12,.85)}
.ly-cover .role em{font-style:italic;color:var(--br)}
.ly-cover .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;
  border-top:.3mm solid rgba(255,255,255,.30);padding-top:4mm;
  font-family:"Space Mono",monospace;font-size:5.6pt;letter-spacing:.16em;text-transform:uppercase;color:#C3CDD1}
.ly-cover .meta b{color:#fff;font-weight:400;display:block;margin-bottom:1.4mm;color:var(--br)}

/* ---------------------------------------------------------------- statement */
.ly-stm .in{position:absolute;left:var(--M);right:var(--M);top:26mm;z-index:3}
.ly-stm h1{font-size:31pt;color:#fff;max-width:245mm}
.ly-stm h1 em{font-family:"Spectral",serif;font-style:italic;font-weight:300;text-transform:none;
  color:var(--br);letter-spacing:0}
.ly-stm p{margin-top:9mm;font-size:10.6pt;line-height:1.55;color:#C3CFD3;max-width:238mm;font-weight:300;
  column-count:2;column-gap:12mm}
.ly-stm p b{color:#fff;font-weight:500}
.ly-stm .band{position:absolute;left:var(--M);right:var(--M);bottom:12.5mm;height:66mm;
  display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;z-index:3}

/* ---------------------------------------------------------------- profile */
.prof .two{display:grid;grid-template-columns:1fr 92mm;gap:11mm}
.prof .big{font-size:13pt;line-height:1.42;font-weight:300;margin-bottom:7mm;max-width:230mm}
.prof .big b{font-weight:500}
.prof dl{border-top:.3mm solid var(--line)}
.prof dl div{display:grid;grid-template-columns:25mm 1fr;gap:3mm;padding:1.8mm 0;
  border-bottom:.3mm solid var(--line)}
.prof dt{font-family:"Space Mono",monospace;font-size:5.3pt;letter-spacing:.14em;text-transform:uppercase;color:var(--sig)}
.prof dd{font-size:7.7pt;line-height:1.38}
.prof .kk{font-family:"Space Mono",monospace;font-size:5.3pt;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sig);margin-bottom:3mm}
.prof .chips{display:flex;flex-wrap:wrap;gap:1.5mm;margin-bottom:6mm}
.prof .chips span{font-family:"Space Mono",monospace;font-size:5.3pt;letter-spacing:.1em;
  border:.3mm solid var(--line);padding:1.1mm 2mm;color:var(--mut)}
.prof .stats{display:grid;grid-template-columns:repeat(2,1fr);border:.3mm solid var(--line)}
.prof .stats div{padding:3mm;border-right:.3mm solid var(--line);border-bottom:.3mm solid var(--line)}
.prof .stats div:nth-child(2n){border-right:0}
.prof .stats div:nth-child(n+3){border-bottom:0}
.prof .stats b{display:block;font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:800;
  font-size:15pt;line-height:1;color:var(--tx)}
.prof .stats span{font-family:"Space Mono",monospace;font-size:4.9pt;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mut);display:block;margin-top:1.4mm}
.prof .band{margin-top:7mm;height:56mm;display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}

/* ---------------------------------------------------------------- contents */
.toc .cols{display:grid;grid-template-columns:1fr 1fr;gap:11mm;height:99mm;align-content:start}
.toc h3{display:flex;justify-content:space-between;align-items:baseline;gap:4mm;
  font-family:"Space Mono",monospace;font-size:5.4pt;letter-spacing:.22em;text-transform:uppercase;
  color:var(--sig);margin:4mm 0 1.2mm;padding-bottom:1mm;border-bottom:.3mm solid var(--line)}
.toc h3:first-child{margin-top:0}
.toc .row{display:grid;grid-template-columns:11mm 1fr 8mm;gap:2mm;align-items:baseline;padding:1.05mm 0}
.toc .n{font-family:"Space Mono",monospace;font-size:5.4pt;color:var(--mut);letter-spacing:.06em}
.toc .t{font-family:"Archivo",sans-serif;font-weight:600;font-size:7.6pt}
.toc .p{font-family:"Space Mono",monospace;font-size:5.6pt;color:var(--sig);text-align:right}
.toc .band{height:58mm;display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-top:6mm}
.toc .band figure .lbl{position:absolute;left:0;right:0;bottom:0;padding:3mm 3mm 2.4mm;
  background:linear-gradient(0deg,rgba(12,17,20,.96) 0%,rgba(12,17,20,.72) 48%,rgba(12,17,20,0) 100%);
  font-family:"Archivo",sans-serif;font-weight:700;font-size:7.4pt;text-transform:uppercase;
  color:#fff;line-height:1.2;z-index:2}
.toc .band figure .lbl b{display:block;font-family:"Space Mono",monospace;font-size:5pt;font-weight:400;
  letter-spacing:.22em;color:var(--br);margin-bottom:1.2mm}

/* ---------------------------------------------------------------- divider */
.ly-div .in{position:absolute;left:var(--M);top:var(--M);bottom:var(--M);width:158mm;z-index:3;
  display:flex;flex-direction:column;justify-content:center;color:#fff}
.ly-div .num{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:900;font-size:96pt;
  line-height:.8;color:rgba(79,183,196,.20);letter-spacing:-.04em;margin-bottom:-6mm}
.ly-div .cd{font-family:"Space Mono",monospace;font-size:6pt;letter-spacing:.32em;text-transform:uppercase;
  color:var(--br);margin-bottom:5mm;display:flex;align-items:center;gap:3mm}
.ly-div .cd i{width:2.4mm;height:2.4mm;border:.3mm solid var(--br);transform:rotate(45deg);display:block}
.ly-div h2{font-size:32pt;color:#fff}
.ly-div p{margin-top:6mm;font-size:9.4pt;line-height:1.52;color:#D8E0E2;max-width:124mm;font-weight:300}
.ly-div p b{color:#fff;font-weight:500}
.ly-div .strip{position:absolute;left:var(--M);right:var(--M);bottom:11mm;z-index:3;display:flex;gap:9mm;
  align-items:baseline;border-top:.3mm solid rgba(255,255,255,.26);padding-top:3.2mm;
  font-family:"Space Mono",monospace;font-size:5.2pt;letter-spacing:.16em;text-transform:uppercase;color:#9FADB3}
.ly-div .strip b{color:var(--br);font-weight:400}
.ly-div .strip .pn{margin-left:auto;color:var(--br)}

/* ---------------------------------------------------------------- text + plates */
.tp{display:grid;grid-template-columns:74mm minmax(0,1fr);grid-template-rows:minmax(0,1fr);
     gap:5mm;height:100%}
.tp>.col{min-height:0;overflow:hidden}
.tp>.st{min-height:0}
.tp .col p{font-size:7.9pt;line-height:1.5;margin-bottom:3.2mm}
.tp .col p b{font-weight:500}
.tp .col dl{margin-top:4mm;border-top:.3mm solid var(--line)}
.dk .tp .col dl{border-color:var(--ink-4)}
.tp .col dl div{display:grid;grid-template-columns:19mm 1fr;gap:2mm;padding:1.3mm 0;border-bottom:.3mm solid var(--line)}
.dk .tp .col dl div{border-color:var(--ink-4)}
.tp .col dt{font-family:"Space Mono",monospace;font-size:4.8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--sig)}
.dk .tp .col dt{color:var(--br)}
.tp .col dd{font-size:6.9pt;line-height:1.32}
.tp .st{display:grid;gap:3mm;height:100%;min-width:0}

/* ---------------------------------------------------------------- process strip */
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:2.5mm}
.pipe .st{border:.3mm solid var(--line);padding:2.8mm 2.4mm;background:var(--paper-2)}
.pipe .st .n{font-family:"Space Mono",monospace;font-size:5pt;color:var(--sig);letter-spacing:.14em}
.pipe .st h5{font-family:"Archivo",sans-serif;font-weight:700;font-size:6.6pt;text-transform:uppercase;margin:1.2mm 0 .9mm}
.pipe .st p{font-family:"Space Mono",monospace;font-size:4.6pt;line-height:1.4;color:var(--mut);letter-spacing:0}

/* ---------------------------------------------------------------- back */
.ly-back .in{position:absolute;inset:var(--M);z-index:3;display:flex;flex-direction:column;justify-content:space-between}
.ly-back h2{font-size:34pt;color:#fff}
.ly-back h2 em{font-family:"Spectral",serif;font-style:italic;font-weight:300;text-transform:none;color:var(--br)}
.ly-back .links{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;
  border-top:.3mm solid rgba(255,255,255,.26);padding-top:5mm;margin-top:6mm}
.ly-back .k{font-family:"Space Mono",monospace;font-size:5.2pt;letter-spacing:.18em;text-transform:uppercase;
  color:#8FA0A6;display:block;margin-bottom:1.6mm}
.ly-back .v{font-family:"Archivo",sans-serif;font-weight:600;font-size:10.5pt;color:#fff}
.ly-back .note{font-family:"Space Mono",monospace;font-size:5.2pt;letter-spacing:.18em;text-transform:uppercase;
  color:#7C8A91;line-height:2}
.ly-back .note b{color:var(--br);font-weight:400}
</style>
</head>
<body>
<div id="doc"></div>
<script src="pages.js"></script>
</body>
</html>
